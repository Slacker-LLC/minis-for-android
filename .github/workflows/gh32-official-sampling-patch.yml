name: GH32 official sampling patch

on:
  push:
    branches:
      - feature/issue-32-session-overrides

permissions:
  contents: write

jobs:
  apply-official-sampling:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/issue-32-session-overrides
          fetch-depth: 0

      - name: Apply official provider sampling rules
        run: |
          python3 scripts/gh32_official_sampling_patch.py
          git diff --check
          git diff --stat

      - name: Commit provider rules and remove temporary files
        run: |
          rm .github/workflows/gh32-official-sampling-patch.yml scripts/gh32_official_sampling_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(session): follow official provider sampling contracts'
          git push origin HEAD:feature/issue-32-session-overrides
