name: tmp-upstream-audit-gaps

on:
  push:
    branches:
      - fix/upstream-audit-gaps-20260909

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/upstream-audit-gaps-20260909
          fetch-depth: 0
      - name: Apply audited fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('.github/scripts/apply_upstream_audit_gaps.py')
          text = script.read_text(encoding='utf-8')
          text = text.replace('"🇨🇳"', '"\\\\uD83C\\\\uDDE8\\\\uD83C\\\\uDDF3"')
          text = text.replace('"🇹🇼"', '"\\\\uD83C\\\\uDDF9\\\\uD83C\\\\uDDFC"')
          script.write_text(text, encoding='utf-8')

          main = Path('src/android/app/src/main/java/com/openminis/app/MainActivity.kt')
          s = main.read_text(encoding='utf-8')
          if 'showing newer-database guidance screen' not in s:
              old = '''        val minisApp = application as? MinisApp
          if (minisApp == null || !minisApp.subsystemsInitialized) {
          '''
              new = '''        val minisApp = application as? MinisApp

          if (minisApp != null &&
              minisApp.dbVersionDecision ==
              com.openminis.app.data.db.DatabaseVersionGuard.Decision.SHOW_NEWER_DB_GUIDANCE
          ) {
              android.util.Log.w("MainActivity", "showing newer-database guidance screen")
              setContent { NewerDatabaseGuidanceScreen(onExit = { finishAndRemoveTask() }) }
              return
          }

          if (minisApp == null || !minisApp.subsystemsInitialized) {
          '''
              if old not in s:
                  raise SystemExit('Fork MainActivity anchor not found')
              s = s.replace(old, new, 1)
              main.write_text(s, encoding='utf-8')
          PY
          python .github/scripts/apply_upstream_audit_gaps.py
      - name: Validate diff
        run: |
          git diff --check
          git diff --exit-code -- . ':!.github/scripts/apply_upstream_audit_gaps.py' ':!.github/workflows/tmp-upstream-audit-gaps.yml' >/dev/null && exit 1 || true
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/android/app
          git commit -m "fix(android): apply remaining upstream audit gaps"
          git push origin HEAD:fix/upstream-audit-gaps-20260909
