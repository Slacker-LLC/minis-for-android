name: tmp-upstream-audit-gaps

on:
  push:
    branches:
      - fix/upstream-audit-gaps-20260909

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/upstream-audit-gaps-20260909
          fetch-depth: 0
      - name: Apply audited fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          script = Path('.github/scripts/apply_upstream_audit_gaps.py')
          text = script.read_text(encoding='utf-8')
          text = text.replace('"🇨🇳"', '"\\\\uD83C\\\\uDDE8\\\\uD83C\\\\uDDF3"')
          text = text.replace('"🇹🇼"', '"\\\\uD83C\\\\uDDF9\\\\uD83C\\\\uDDFC"')
          script.write_text(text, encoding='utf-8')

          main = Path('src/android/app/src/main/java/com/openminis/app/MainActivity.kt')
          s = main.read_text(encoding='utf-8')
          if 'showing newer-database guidance screen' not in s:
              pattern = re.compile(
                  r'(?m)^(?P<i>\s*)val minisApp = application as\? MinisApp\n(?P=i)if \(minisApp == null \|\| !minisApp\.subsystemsInitialized\) \{'
              )
              m = pattern.search(s)
              if not m:
                  raise SystemExit('Fork MainActivity anchor not found')
              i = m.group('i')
              replacement = (
                  f'{i}val minisApp = application as? MinisApp\n\n'
                  f'{i}if (minisApp != null &&\n'
                  f'{i}    minisApp.dbVersionDecision ==\n'
                  f'{i}    com.openminis.app.data.db.DatabaseVersionGuard.Decision.SHOW_NEWER_DB_GUIDANCE\n'
                  f'{i}) {{\n'
                  f'{i}    android.util.Log.w("MainActivity", "showing newer-database guidance screen")\n'
                  f'{i}    setContent {{ NewerDatabaseGuidanceScreen(onExit = {{ finishAndRemoveTask() }}) }}\n'
                  f'{i}    return\n'
                  f'{i}}}\n\n'
                  f'{i}if (minisApp == null || !minisApp.subsystemsInitialized) {{'
              )
              s = pattern.sub(lambda _: replacement, s, count=1)
              main.write_text(s, encoding='utf-8')
          PY
          python .github/scripts/apply_upstream_audit_gaps.py
      - name: Validate diff
        run: |
          git diff --check
          git diff --exit-code -- . ':!.github/scripts/apply_upstream_audit_gaps.py' ':!.github/workflows/tmp-upstream-audit-gaps.yml' >/dev/null && exit 1 || true
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/android/app
          git commit -m "fix(android): apply remaining upstream audit gaps"
          git push origin HEAD:fix/upstream-audit-gaps-20260909
