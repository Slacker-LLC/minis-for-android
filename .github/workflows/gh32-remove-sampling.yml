name: GH32 remove session sampling overrides

on:
  push:
    branches:
      - feature/issue-32-session-overrides
    paths:
      - .github/workflows/gh32-remove-sampling.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feature/issue-32-session-overrides
      - name: Patch source
        run: python3 .github/gh32_remove_sampling.py
      - name: Remove temporary patch files
        run: |
          rm .github/gh32_remove_sampling.py
          rm .github/workflows/gh32-remove-sampling.yml
      - name: Verify diff
        run: |
          git diff --check
          git status --short
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(session): remove Top P and Top K overrides"
          git push origin HEAD:feature/issue-32-session-overrides
