name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.filter.outputs.android }}
      docs: ${{ steps.filter.outputs.docs }}
      minisd: ${{ steps.filter.outputs.minisd }}
      rootfs: ${{ steps.filter.outputs.rootfs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          fi

          android=false
          docs=false
          minisd=false
          rootfs=false

          mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf 'Changed files:\n'
          printf '  %s\n' "${changed_files[@]}"

          for path in "${changed_files[@]}"; do
            case "$path" in
              *.md|AGENTS.md|LICENSE|scripts/check_docs_provenance.py|scripts/test_docs_provenance.py)
                docs=true
                ;;
            esac
            case "$path" in
              src/native/minisd/*)
                minisd=true
                ;;
            esac
            case "$path" in
              scripts/build-ubuntu-rootfs.sh|scripts/test-build-ubuntu-rootfs-verification.sh|scripts/verify-android-release.sh|scripts/check-runtime-package-boundary.sh|src/android/*)
                rootfs=true
                ;;
            esac
            case "$path" in
              src/android/*|src/shared/bashism/*|scripts/gen_debug_skill_android.sh|scripts/verify-android-release.sh)
                android=true
                ;;
            esac
            if [[ "$path" == ".github/workflows/ci.yml" ]]; then
              android=true
              docs=true
              minisd=true
              rootfs=true
            fi
          done

          {
            echo "android=$android"
            echo "docs=$docs"
            echo "minisd=$minisd"
            echo "rootfs=$rootfs"
          } | tee -a "$GITHUB_OUTPUT"

  docs-provenance:
    name: Documentation provenance guard
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Guard unit tests
        run: python3 scripts/test_docs_provenance.py
      - name: Check current docs and provenance allowlist
        run: python3 scripts/check_docs_provenance.py

  minisd:
    name: minisd quality
    needs: changes
    if: needs.changes.outputs.minisd == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust quality components
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --manifest-path src/native/minisd/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path src/native/minisd/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --manifest-path src/native/minisd/Cargo.toml
      - name: Release build
        run: cargo build --locked --release --manifest-path src/native/minisd/Cargo.toml

  rootfs-verification:
    name: Rootfs verification tests
    needs: changes
    if: needs.changes.outputs.rootfs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        run: bash -n scripts/build-ubuntu-rootfs.sh scripts/test-build-ubuntu-rootfs-verification.sh scripts/verify-android-release.sh scripts/check-runtime-package-boundary.sh
      - name: Fail-closed checksum tests
        run: bash scripts/test-build-ubuntu-rootfs-verification.sh
      - name: Runtime package boundary contract
        run: bash scripts/check-runtime-package-boundary.sh

  android-checks:
    name: Android ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit tests
            task: :app:testDebugUnitTest
          - name: debug lint
            task: :app:lintDebug
          - name: release lint
            task: :app:lintRelease
          - name: debug build
            task: :app:assembleDebug
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Prepare Gradle wrapper
        run: chmod +x src/android/gradlew
      - name: Run ${{ matrix.name }}
        working-directory: src/android
        run: ./gradlew ${{ matrix.task }} --max-workers=4 --stacktrace

  android-release:
    name: Android release build and verification
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    env:
      RELEASE_KEYSTORE: /tmp/ci-release.jks
      RELEASE_STORE_PASSWORD: ci-release-pass
      RELEASE_KEY_ALIAS: ci-release
      RELEASE_KEY_PASSWORD: ci-release-pass
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Prepare Gradle wrapper
        run: chmod +x src/android/gradlew
      - name: Verify missing release credentials fail closed
        working-directory: src/android
        run: |
          set +e
          output="$(env -u RELEASE_KEYSTORE -u RELEASE_STORE_PASSWORD -u RELEASE_KEY_ALIAS -u RELEASE_KEY_PASSWORD \
            ./gradlew :app:requireReleaseSigning --max-workers=4 --stacktrace 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "release signing gate unexpectedly succeeded without credentials" >&2
            exit 1
          fi
          if ! grep -Fq "Production release signing is not configured." <<<"$output"; then
            echo "release signing check failed for an unexpected reason" >&2
            exit 1
          fi
      - name: Generate ephemeral CI release key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RELEASE_KEYSTORE" \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -keypass "$RELEASE_KEY_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Minis CI Release,O=Slacker LLC,C=US"
      - name: Assemble release
        working-directory: src/android
        run: ./gradlew :app:assembleRelease --max-workers=4 --stacktrace
      - name: Verify release APK
        run: bash scripts/verify-android-release.sh src/android/app/build/outputs/apk/release/app-release.apk

  android:
    name: Android build, test and release checks
    if: always()
    needs: [changes, android-checks, android-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Android check results
        env:
          ANDROID_CHANGED: ${{ needs.changes.outputs.android }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECKS_RESULT: ${{ needs.android-checks.result }}
          RELEASE_RESULT: ${{ needs.android-release.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Changed-path detection failed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$ANDROID_CHANGED" != "true" ]]; then
            echo "No Android-related files changed; Android checks were skipped."
            exit 0
          fi
          if [[ "$CHECKS_RESULT" != "success" || "$RELEASE_RESULT" != "success" ]]; then
            echo "Android checks failed: checks=$CHECKS_RESULT release=$RELEASE_RESULT" >&2
            exit 1
          fi
          echo "All Android checks passed."
