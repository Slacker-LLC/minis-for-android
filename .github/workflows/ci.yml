name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-provenance:
    name: Documentation provenance guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Guard unit tests
        run: python3 scripts/test_docs_provenance.py
      - name: Check current docs and provenance allowlist
        run: python3 scripts/check_docs_provenance.py

  minisd:
    name: minisd quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust quality components
        run: |
          rustup component add rustfmt clippy
          rustup target add aarch64-unknown-linux-musl
      - name: Format
        working-directory: src/native/minisd
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: src/native/minisd
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: src/native/minisd
        run: cargo test --locked
      - name: Release build (host)
        working-directory: src/native/minisd
        run: cargo build --locked --release
      - name: Release build (Linux arm64 musl compatibility)
        working-directory: src/native/minisd
        run: cargo build --locked --release --target aarch64-unknown-linux-musl
      - name: Verify Linux arm64 PIE compatibility
        working-directory: src/native/minisd
        run: |
          binary=target/aarch64-unknown-linux-musl/release/minisd
          header="$(readelf -h "$binary")"
          grep -Eq 'Class:[[:space:]]+ELF64' <<<"$header"
          grep -Eq 'Machine:[[:space:]]+AArch64' <<<"$header"
          grep -Eq 'Type:[[:space:]]+DYN' <<<"$header"

  rootfs-verification:
    name: Rootfs verification tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        run: bash -n scripts/build-ubuntu-rootfs.sh scripts/test-build-ubuntu-rootfs-verification.sh scripts/verify-android-release.sh scripts/check-runtime-package-boundary.sh scripts/test-android-identity.sh
      - name: Fail-closed checksum tests
        run: bash scripts/test-build-ubuntu-rootfs-verification.sh
      - name: Runtime package boundary contract
        run: bash scripts/check-runtime-package-boundary.sh
      - name: Android identity regression tests
        run: bash scripts/test-android-identity.sh

  android:
    name: Android build, test and release checks
    runs-on: ubuntu-24.04
    env:
      RELEASE_KEYSTORE: /tmp/ci-release.jks
      RELEASE_STORE_PASSWORD: ci-release-pass
      RELEASE_KEY_ALIAS: ci-release
      RELEASE_KEY_PASSWORD: ci-release-pass
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
          rustup target add aarch64-linux-android
      - name: Warm Gradle plugin resolution
        working-directory: src/android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle dependency-resolution attempt $attempt/3"
            if ./gradlew help --refresh-dependencies --no-parallel --max-workers=2 --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle plugin/dependency resolution failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Verify missing release credentials fail closed
        working-directory: src/android
        run: |
          set +e
          output="$(env -u RELEASE_KEYSTORE -u RELEASE_STORE_PASSWORD -u RELEASE_KEY_ALIAS -u RELEASE_KEY_PASSWORD \
            ./gradlew :app:requireReleaseSigning --no-parallel --max-workers=2 --stacktrace 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "release signing gate unexpectedly succeeded without credentials" >&2
            exit 1
          fi
          if ! grep -Fq "Production release signing is not configured." <<<"$output"; then
            echo "release signing check failed for an unexpected reason" >&2
            exit 1
          fi
      - name: Generate ephemeral CI release key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RELEASE_KEYSTORE" \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -keypass "$RELEASE_KEY_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Minis CI Release,O=Slacker LLC,C=US"
      - name: Android unit tests
        working-directory: src/android
        run: ./gradlew :app:testDebugUnitTest --no-parallel --max-workers=2 --stacktrace
      - name: Stop Gradle after tests
        if: always()
        working-directory: src/android
        run: ./gradlew --stop || true
      - name: Debug lint
        working-directory: src/android
        run: ./gradlew :app:lintDebug --no-parallel --max-workers=2 --stacktrace
      - name: Stop Gradle after debug lint
        if: always()
        working-directory: src/android
        run: ./gradlew --stop || true
      - name: Release lint
        working-directory: src/android
        run: ./gradlew :app:lintRelease --no-parallel --max-workers=2 --stacktrace
      - name: Stop Gradle after release lint
        if: always()
        working-directory: src/android
        run: ./gradlew --stop || true
      - name: Assemble debug
        working-directory: src/android
        run: ./gradlew :app:assembleDebug --no-parallel --max-workers=2 --stacktrace
      - name: Stop Gradle after debug packaging
        if: always()
        working-directory: src/android
        run: ./gradlew --stop || true
      - name: Compile release Kotlin
        working-directory: src/android
        run: ./gradlew :app:compileReleaseKotlin --no-parallel --max-workers=2 --stacktrace
      - name: Stop Gradle after release compile
        if: always()
        working-directory: src/android
        run: ./gradlew --stop || true
      - name: Assemble release
        working-directory: src/android
        run: ./gradlew :app:assembleRelease --no-parallel --max-workers=2 --stacktrace
      - name: Verify release APK
        run: bash scripts/verify-android-release.sh src/android/app/build/outputs/apk/release/app-release.apk
