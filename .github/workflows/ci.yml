name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minisd:
    name: minisd tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test minisd
        run: cargo test --locked --manifest-path src/native/minisd/Cargo.toml

  android:
    name: Android compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile debug Kotlin
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace
