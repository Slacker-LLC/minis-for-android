name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-provenance:
    name: Documentation provenance guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Guard unit tests
        run: python3 scripts/test_docs_provenance.py
      - name: Check current docs and provenance allowlist
        run: python3 scripts/check_docs_provenance.py

  minisd:
    name: minisd quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust quality components
        run: |
          rustup component add rustfmt clippy
          rustup target add aarch64-unknown-linux-musl
      - name: Format
        working-directory: src/native/minisd
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: src/native/minisd
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: src/native/minisd
        run: cargo test --locked
      - name: Release build (host)
        working-directory: src/native/minisd
        run: cargo build --locked --release
      - name: Release build (Linux arm64 musl compatibility)
        working-directory: src/native/minisd
        run: cargo build --locked --release --target aarch64-unknown-linux-musl
      - name: Verify Linux arm64 PIE compatibility
        working-directory: src/native/minisd
        run: |
          binary=target/aarch64-unknown-linux-musl/release/minisd
          header="$(readelf -h "$binary")"
          grep -Eq 'Class:[[:space:]]+ELF64' <<<"$header"
          grep -Eq 'Machine:[[:space:]]+AArch64' <<<"$header"
          grep -Eq 'Type:[[:space:]]+DYN' <<<"$header"

  rootfs-verification:
    name: Rootfs verification tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        run: bash -n scripts/build-ubuntu-rootfs.sh scripts/test-build-ubuntu-rootfs-verification.sh scripts/verify-android-release.sh scripts/check-runtime-package-boundary.sh scripts/test-android-identity.sh
      - name: Rootfs fail-closed and reproducibility tests
        run: bash scripts/test-build-ubuntu-rootfs-verification.sh
      - name: Runtime package boundary contract
        run: bash scripts/check-runtime-package-boundary.sh
      - name: Android identity regression tests
        run: bash scripts/test-android-identity.sh
      - name: Diff hygiene
        run: git diff --check

  android:
    name: Android build, test and release checks
    runs-on: ubuntu-24.04
    env:
      RELEASE_KEYSTORE: /tmp/ci-release.jks
      RELEASE_STORE_PASSWORD: ci-release-pass
      RELEASE_KEY_ALIAS: ci-release
      RELEASE_KEY_PASSWORD: ci-release-pass
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
          rustup target add aarch64-linux-android
      - name: Warm Gradle plugin resolution
        working-directory: src/android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle dependency-resolution attempt $attempt/3"
            if ./gradlew help --refresh-dependencies --no-parallel --max-workers=2 --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle plugin/dependency resolution failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Verify missing release credentials fail closed
        working-directory: src/android
        run: |
          set +e
          output="$(env -u RELEASE_KEYSTORE -u RELEASE_STORE_PASSWORD -u RELEASE_KEY_ALIAS -u RELEASE_KEY_PASSWORD \
            ./gradlew :app:requireReleaseSigning --no-parallel --max-workers=2 --stacktrace 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "release signing gate unexpectedly succeeded without credentials" >&2
            exit 1
          fi
          if ! grep -Fq "Production release signing is not configured." <<<"$output"; then
            echo "release signing check failed for an unexpected reason" >&2
            exit 1
          fi
      - name: Generate ephemeral CI release key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RELEASE_KEYSTORE" \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -keypass "$RELEASE_KEY_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Minis CI Release,O=Slacker LLC,C=US"
      - name: Build pinned Ubuntu arm64 runtime artifact
        run: bash scripts/build-ubuntu-rootfs.sh
      - name: Verify rootfs build identity
        run: |
          (cd dist && sha256sum -c ubuntu-arm64-rootfs.tar.gz.sha256)
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path('dist')
          archive = root / 'ubuntu-arm64-rootfs.tar.gz'
          meta = json.loads((root / 'ubuntu-arm64-rootfs.manifest.json').read_text())
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert meta['sha256'] == digest
          assert meta['version'].endswith(digest[:16])
          assert re.fullmatch(r'ubuntu-24\.04-r[1-9][0-9]*-[0-9a-f]{16}', meta['version'])
          assert meta['arch'] == 'arm64-v8a'
          assert isinstance(meta['provisionRevision'], int) and meta['provisionRevision'] > 0
          assert meta['requiredCommands'] == ['python3', 'git', 'curl']
          PY
      - name: Android unit tests
        working-directory: src/android
        run: ./gradlew :app:testDebugUnitTest --no-parallel --max-workers=2 --stacktrace
      - name: Stop Gradle after tests
        if: always()
        working-directory: src/android
        run: ./gradlew --stop || true
      - name: Debug lint
        working-directory: src/android
        run: ./gradlew :app:lintDebug --no-parallel --max-workers=2 --stacktrace
      - name: Stop Gradle after debug lint
        if: always()
        working-directory: src/android
        run: ./gradlew --stop || true
      - name: Release lint
        working-directory: src/android
        run: ./gradlew :app:lintRelease --no-parallel --max-workers=2 --stacktrace
      - name: Stop Gradle after release lint
        if: always()
        working-directory: src/android
        run: ./gradlew --stop || true
      - name: Assemble and verify debug APK runtime
        working-directory: src/android
        run: |
          cat >/tmp/runtime-assets-probe.gradle <<'GRADLE'
          allprojects {
            tasks.configureEach { task ->
              if (task.name == 'mergeDebugAssets') {
                task.doFirst {
                  println('RUNTIME_PROBE mergeDebugAssets runtime-like inputs:')
                  task.inputs.files.files.toList().sort { a, b -> a.absolutePath <=> b.absolutePath }.each { file ->
                    def path = file.absolutePath
                    if (path.contains('runtimeAssets') || path.contains('minis-runtime') ||
                        file.name.contains('ubuntu-arm64-rootfs') || file.name == 'runtime-manifest.json') {
                      println("RUNTIME_PROBE input path=${path} exists=${file.exists()} dir=${file.isDirectory()} bytes=${file.isFile() ? file.length() : -1}")
                    }
                  }
                }
                task.doLast {
                  println('RUNTIME_PROBE mergeDebugAssets outputs:')
                  task.outputs.files.files.toList().sort { a, b -> a.absolutePath <=> b.absolutePath }.each { file ->
                    println("RUNTIME_PROBE output path=${file.absolutePath} exists=${file.exists()} dir=${file.isDirectory()}")
                  }
                }
              }
            }
          }
          GRADLE
          set +e
          ./gradlew :app:assembleDebug :app:verifyDebugMinisdApk -I /tmp/runtime-assets-probe.gradle --no-parallel --max-workers=2 --stacktrace
          status=$?
          set -e
          echo 'RUNTIME_PROBE generated/merged runtime candidates:'
          find app/build -type f \( -name 'ubuntu-arm64-rootfs.tar.gz' -o -name 'runtime-manifest.json' \) -print | sort || true
          apk=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$apk" ]; then
            echo 'RUNTIME_PROBE final APK runtime-like entries:'
            unzip -Z1 "$apk" | grep -E '(^assets/|minis-runtime|ubuntu-arm64-rootfs|runtime-manifest)' | sort || true
          else
            echo "RUNTIME_PROBE final APK missing: $apk"
          fi
          exit "$status"
      - name: Compile installed-layout instrumentation gate
        working-directory: src/android
        run: ./gradlew :app:assembleDebugAndroidTest --no-parallel --max-workers=2 --stacktrace
      - name: Stop Gradle after debug packaging
        if: always()
        working-directory: src/android
        run: ./gradlew --stop || true
      - name: Compile release Kotlin
        working-directory: src/android
        run: ./gradlew :app:compileReleaseKotlin --no-parallel --max-workers=2 --stacktrace
      - name: Stop Gradle after release compile
        if: always()
        working-directory: src/android
        run: ./gradlew --stop || true
      - name: Assemble and verify release APK runtime
        working-directory: src/android
        run: ./gradlew :app:assembleRelease :app:verifyReleaseMinisdApk --no-parallel --max-workers=2 --stacktrace
      - name: Verify release APK signing/package contract
        run: bash scripts/verify-android-release.sh src/android/app/build/outputs/apk/release/app-release.apk
      - name: Final diff hygiene
        run: git diff --check
