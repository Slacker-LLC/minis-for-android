name: Temporary upstream behavior sync patch

on:
  push:
    branches:
      - sync/upstream-behavior-20260909

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-behavior-20260909
          fetch-depth: 0

      - name: Apply verified upstream behavior deltas
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) SOUL prompt hint: the runtime already parses/serializes icon; tell the agent.
          replace_once(
              "src/android/app/src/main/java/com/openminis/app/agent/SoulStore.kt",
              "SOUL.md fields (name / style / lang / body) can be edited two ways:",
              "SOUL.md fields (name / icon / style / lang / body) can be edited two ways:",
          )

          # 2) OAuth credential presence helper used by credential-aware group routing.
          oauth = "src/android/app/src/main/java/com/openminis/app/auth/OAuthManager.kt"
          marker = "        /** Create the appropriate OAuthManager for a provider instance. */"
          helper = '''        /**
           * [T-android-group-resolve-skip-uncredentialed] Whether ANY OAuth
           * credential is stored for [instanceId] — either a token bundle from a
           * completed login or a user-pasted manual bearer.
           *
           * Static on purpose. Provider routing needs a cheap synchronous yes/no
           * and must not depend on [forInstance], which deliberately omits some
           * provider types (notably Gemini). Presence only: refresh/validation
           * still happens on the request path.
           */
          fun hasStoredCredential(context: Context, instanceId: String): Boolean {
              val prefs = com.openminis.app.util.EncryptedPrefsFactory
                  .safeCreate(context, "oauth_prefs")
              if (!prefs.getString("oauth_tokens_$instanceId", null).isNullOrEmpty()) return true
              return !prefs.getString("oauth_${KEY_MANUAL_BEARER}_$instanceId", null).isNullOrEmpty()
          }
'''
          replace_once(oauth, marker, helper + "\n" + marker)

          provider = "src/android/app/src/main/java/com/openminis/app/data/repository/ProviderRepository.kt"
          first_enabled = '''    /** Convenience: first enabled member of [group] in declaration order. */
          fun firstEnabledMemberEntry(group: ModelGroup): ModelEntry? =
              enabledMemberEntries(group).firstOrNull()
'''
          credential_helpers = first_enabled + '''
          /**
           * [T-android-group-resolve-skip-uncredentialed] Whether [instance] has ANY
           * usable credential — API key, keyless-by-design compat access, manual
           * bearer, or a stored OAuth token.
           *
           * This only probes credential storage. Expiry/refresh remains owned by
           * the request path, so an expired-but-present OAuth token still keeps the
           * provider in the routing set and gets its normal refresh attempt later.
           */
          fun hasAnyCredential(instance: ProviderInstance): Boolean {
              if (usableApiKey(instance) != null) return true
              return com.openminis.app.auth.OAuthManager.hasStoredCredential(context, instance.id)
          }

          /**
           * [T-android-group-resolve-skip-uncredentialed] Members of [group] that
           * are actually usable right now: not hidden, provider enabled, and with
           * a usable stored credential. Declaration order is preserved.
           */
          fun availableMemberEntries(group: ModelGroup): List<ModelEntry> {
              val config = _config.value
              return group.memberEntryIds.mapNotNull { entryId ->
                  val entry = config.modelEntries.find { it.id == entryId } ?: return@mapNotNull null
                  if (entry.isHidden) return@mapNotNull null
                  val instance = config.instances.find { it.id == entry.providerInstanceId }
                      ?: return@mapNotNull null
                  if (!instance.isEnabled) return@mapNotNull null
                  if (!hasAnyCredential(instance)) return@mapNotNull null
                  entry
              }
          }
'''
          replace_once(provider, first_enabled, credential_helpers)
          replace_once(
              provider,
              "        return firstEnabledMemberEntry(group)\n",
              "        return availableMemberEntries(group).firstOrNull()\n",
          )

          chat_vm = "src/android/app/src/main/java/com/openminis/app/ui/chat/ChatViewModel.kt"
          replace_once(
              chat_vm,
              "        val enabledMembers = providerRepository.enabledMemberEntries(group)\n",
              "        val enabledMembers = providerRepository.availableMemberEntries(group)\n",
          )

          scheduled = "src/android/app/src/main/java/com/openminis/app/scheduled/ScheduledAgentRunner.kt"
          replace_once(
              scheduled,
              "                                ?.let { g -> app.providerRepository.enabledMemberEntries(g).firstOrNull()?.model?.id }\n",
              "                                // [T-android-group-resolve-skip-uncredentialed] Scheduled runs are unattended;\n"
              "                                // skip members that cannot authenticate instead of failing on the head member.\n"
              "                                ?.let { g -> app.providerRepository.availableMemberEntries(g).firstOrNull()?.model?.id }\n",
          )

          correction = "src/android/app/src/main/java/com/openminis/app/speech/correction/CorrectionStrategy.kt"
          replace_once(
              correction,
              "        val apiKey = repository.loadApiKey(instance.id) ?: throw CorrectionError.NoModelAvailable\n",
              "        // [T-android-keyless-provider-selection] Keep correction routing aligned with chat:\n"
              "        // keyless self-hosted compatible endpoints are valid configurations.\n"
              "        val apiKey = repository.usableApiKey(instance) ?: throw CorrectionError.NoModelAvailable\n",
          )
          replace_once(
              correction,
              "        val entry = group?.let { repository.firstEnabledMemberEntry(it) }\n",
              "        // [T-android-group-resolve-skip-uncredentialed] Filter before selecting so an\n"
              "        // unauthenticated head member does not make the whole group unusable.\n"
              "        val entry = group?.let { repository.availableMemberEntries(it).firstOrNull() }\n",
          )

          # 3/4) Agent browser: report intercepted JS dialogs and never treat page-driven
          # external schemes as a user gesture.
          browser = "src/android/app/src/main/java/com/openminis/app/browser/BrowserUseManager.kt"
          replace_once(
              browser,
              '''    private val _currentURL = MutableStateFlow("")
          val currentURL: StateFlow<String> = _currentURL.asStateFlow()

          private val _pageTitle = MutableStateFlow("")
''',
              '''    private val _currentURL = MutableStateFlow("")
          val currentURL: StateFlow<String> = _currentURL.asStateFlow()

          /** JS dialogs answered by the headless agent WebView, drained into the next tool result. */
          private val dialogQueue = InterceptedDialogQueue()

          private val _pageTitle = MutableStateFlow("")
''',
          )
          replace_once(
              browser,
              '''                return com.openminis.app.ui.browser.BrowserExternalSchemeHandler
                      .handle(view.context, request.url)
''',
              '''                return com.openminis.app.ui.browser.BrowserExternalSchemeHandler
                      .handle(
                          view.context,
                          request.url,
                          com.openminis.app.ui.browser.BrowserExternalSchemeHandler
                              .Origin.AGENT_BACKGROUND,
                      )
''',
          )
          old_chrome_tail = '''            override fun onCloseWindow(window: WebView) {
                  onCloseWindow?.invoke()
              }
          }
      }
'''
          new_chrome_tail = '''            override fun onCloseWindow(window: WebView) {
                  onCloseWindow?.invoke()
              }

              // [T-android-js-dialogs-256] Headless automation must never block on a
              // native JS modal. Answer conservatively and tell the model on the
              // next browser result what the page received.
              override fun onJsAlert(
                  view: WebView?,
                  url: String?,
                  message: String?,
                  result: android.webkit.JsResult?,
              ): Boolean {
                  recordInterceptedDialog(
                      kind = "alert",
                      message = message.orEmpty(),
                      defaultText = null,
                      defaultResponse = "(dismissed)",
                  )
                  result?.confirm()
                  return true
              }

              override fun onJsConfirm(
                  view: WebView?,
                  url: String?,
                  message: String?,
                  result: android.webkit.JsResult?,
              ): Boolean {
                  recordInterceptedDialog(
                      kind = "confirm",
                      message = message.orEmpty(),
                      defaultText = null,
                      defaultResponse = "false",
                  )
                  result?.cancel()
                  return true
              }

              override fun onJsPrompt(
                  view: WebView?,
                  url: String?,
                  message: String?,
                  defaultValue: String?,
                  result: android.webkit.JsPromptResult?,
              ): Boolean {
                  recordInterceptedDialog(
                      kind = "prompt",
                      message = message.orEmpty(),
                      defaultText = defaultValue,
                      defaultResponse = "null",
                  )
                  result?.cancel()
                  return true
              }
          }
      }

      private fun recordInterceptedDialog(
          kind: String,
          message: String,
          defaultText: String?,
          defaultResponse: String,
      ) {
          val url = _currentURL.value
          dialogQueue.record(
              kind = kind,
              message = message,
              defaultText = defaultText,
              pageURL = url.ifEmpty { null },
              defaultResponse = defaultResponse,
          )
          Log.i(TAG, "[JSDialog] intercepted $kind on $url — answered $defaultResponse")
      }

      /** Drain intercepted dialogs exactly once into text for the model. */
      fun drainInterceptedDialogReport(): String? = dialogQueue.drainReport()
'''
          replace_once(browser, old_chrome_tail, new_chrome_tail)

          pool = "src/android/app/src/main/java/com/openminis/app/browser/BrowserTabPool.kt"
          replace_once(
              pool,
              "            val result = tab.manager.execute(input)\n            // [T-android-browser-result-tab-id] Stamp the VERIFIED tab id",
              "            val result = tab.manager.execute(input)\n"
              "            // [T-android-js-dialogs-256] Surface any alert/confirm/prompt the\n"
              "            // headless WebView answered while this action ran. Drain-once keeps\n"
              "            // each event attached to exactly one tool result.\n"
              "            val withDialogs = tab.manager.drainInterceptedDialogReport()\n"
              "                ?.let { result.copy(text = it + result.text) }\n"
              "                ?: result\n"
              "            // [T-android-browser-result-tab-id] Stamp the VERIFIED tab id",
          )
          replace_once(
              pool,
              "            stampTabId(result.copy(pageURL = tab.manager.currentURL.value), tab.id)\n",
              "            stampTabId(withDialogs.copy(pageURL = tab.manager.currentURL.value), tab.id)\n",
          )

          # 5/6) minis-config prefs parity + SOUL icon surface, adapted to minisd paths.
          cfg = "src/android/app/src/main/java/com/openminis/app/config/ConfigBuiltins.kt"
          replace_once(
              cfg,
              '''    private fun registerChat(r: ConfigRegistry, context: Context) {
              // Default app prefs — Android persists most chat preferences in
              // the default SharedPreferences for the package.
              val prefs = context.getSharedPreferences("minis_settings", Context.MODE_PRIVATE)
''',
              '''    private fun registerChat(r: ConfigRegistry, context: Context) {
              // These settings are owned by AppearanceScreen; minis-config must write
              // the exact same store/keys so a successful set changes live UI behavior.
              val appearancePrefs = context.getSharedPreferences(
                  com.openminis.app.ui.settings.PREF_APPEARANCE,
                  Context.MODE_PRIVATE,
              )
''',
          )
          replace_once(
              cfg,
              '''                prefs = prefs,
                  key = "return_key_behavior",
''',
              '''                prefs = appearancePrefs,
                  key = com.openminis.app.ui.settings.KEY_RETURN_KEY_BEHAVIOR,
''',
          )
          replace_once(
              cfg,
              '''                prefs = prefs,
                  key = "keep_screen_awake_during_tasks",
''',
              '''                prefs = appearancePrefs,
                  key = com.openminis.app.ui.settings.KEY_KEEP_SCREEN_AWAKE,
''',
          )
          replace_once(
              cfg,
              '''        val appearancePrefs = context.getSharedPreferences(
              com.openminis.app.ui.settings.PREF_APPEARANCE,
              Context.MODE_PRIVATE,
          )
          r.register(
              PrefsBoolField(
                  path = "chat.toolPreview",
''',
              '''        r.register(
              PrefsBoolField(
                  path = "chat.toolPreview",
''',
          )
          replace_once(
              cfg,
              "    // (name / style / lang / body) as `soul.*` config paths. The on-disk\n"
              "    // YAML emoji field is intentionally NOT registered — matches the\n"
              "    // iOS rollback where ✨ is locked as the identity icon.\n",
              "    // (name / icon / style / lang / body) as `soul.*` config paths. The legacy\n"
              "    // YAML emoji field remains unregistered; `icon` is the current identity surface.\n",
          )

          soul_marker = "    private fun registerSoul(r: ConfigRegistry, context: Context) {"
          soul_helper = '''    /**
           * Resolve an icon import source through the Fork's minisd-backed filesystem.
           * The source is never stored by path: bytes are decoded and re-encoded by
           * SoulIcon.encode, then the compact data URI is written into SOUL.md.
           */
          private fun resolveSoulIconImage(raw: String): String {
              val icon = com.openminis.app.agent.SoulIcon
              val bytes: ByteArray = when (val src = icon.classifySource(raw)) {
                  is com.openminis.app.agent.SoulIcon.Source.Unsupported ->
                      throw ConfigError.InvalidValue(src.reason)

                  is com.openminis.app.agent.SoulIcon.Source.Bytes -> src.data

                  is com.openminis.app.agent.SoulIcon.Source.LinuxPath -> {
                      val root = icon.ALLOWED_LINUX_ROOTS.firstOrNull {
                          src.path == it || src.path.startsWith("$it/")
                      } ?: throw ConfigError.InvalidValue(
                          "path must be inside one of ${icon.ALLOWED_LINUX_ROOTS.joinToString(", ")}",
                      )
                      val normalized = runCatching {
                          java.nio.file.Paths.get(src.path).normalize().toString()
                      }.getOrElse {
                          throw ConfigError.InvalidValue("invalid path: ${src.path}")
                      }
                      if (normalized != src.path) {
                          throw ConfigError.InvalidValue("path must not contain traversal segments")
                      }
                      val sessionScoped = root == "/var/minis/attachments" ||
                          root == "/var/minis/workspace" ||
                          root == "/var/minis/offloads"
                      val sid = if (sessionScoped) {
                          ChatViewModelStore.activeSessionId
                              ?: throw ConfigError.InvalidValue(
                                  "no active session — open a chat first, or pass the image inline as a data URI",
                              )
                      } else {
                          ""
                      }
                      runCatching {
                          com.openminis.app.runtime.minisd.WorkspaceFileClient
                              .readAllBlocking(sid, src.path)
                      }.getOrElse {
                          throw ConfigError.InvalidValue("could not read ${src.path}: ${it.message}")
                      }
                  }
              }

              val bitmap = runCatching {
                  android.graphics.BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
              }.getOrNull() ?: throw ConfigError.InvalidValue(
                  "that data isn't a decodable image (png / jpeg / webp / gif are supported; svg is not)",
              )

              return when (val result = icon.encode(bitmap)) {
                  is com.openminis.app.agent.SoulIcon.EncodeResult.Success -> result.dataUri
                  is com.openminis.app.agent.SoulIcon.EncodeResult.Failure -> when (result.reason) {
                      com.openminis.app.agent.SoulIcon.Rejection.TOO_LARGE ->
                          throw ConfigError.InvalidValue("that image is too large to store inline")
                      com.openminis.app.agent.SoulIcon.Rejection.UNREADABLE ->
                          throw ConfigError.InvalidValue("that image could not be processed")
                  }
              }
          }

'''
          replace_once(cfg, soul_marker, soul_helper + soul_marker)

          soul_style_marker = '''        r.register(
              ClosureField(
                  path = "soul.style",
'''
          soul_icon_registration = '''        // [T-android-soul-custom-icon][T-android-soul-icon-config-images]
          r.register(
              ClosureField(
                  path = "soul.icon",
                  displayName = "Soul icon",
                  description = "Identity icon/avatar. Accepts one emoji, a base64/data URI image, minis:// resource, or a path under /var/minis/{attachments,workspace,offloads,shared,memory,skills}. Images are center-cropped, downscaled and stored inline; remote URLs are not supported.",
                  valueSchema = ConfigSchema.Str(),
                  risk = ConfigRisk.SENSITIVE,
                  revertable = false,
                  reader = {
                      val raw = loadCurrent().metadata.icon
                      ConfigValue.Str(
                          if (com.openminis.app.agent.SoulIcon.isDataUri(raw)) "<image>" else raw,
                      )
                  },
                  writer = { v ->
                      val raw = (v as? ConfigValue.Str)?.value
                          ?: throw ConfigError.TypeMismatch("string")
                      val trimmed = raw.trim()
                      val cur = loadCurrent()
                      val next = when {
                          trimmed.isEmpty() -> ""
                          com.openminis.app.agent.SoulIcon.graphemeClusters(trimmed).size == 1 &&
                              com.openminis.app.agent.SoulIcon.isEmojiGlyph(trimmed) -> trimmed
                          else -> resolveSoulIconImage(trimmed)
                      }
                      saveCurrent(cur.copy(metadata = cur.metadata.copy(icon = next)))
                  },
              )
          )

'''
          replace_once(cfg, soul_style_marker, soul_icon_registration + soul_style_marker)

          # Upstream's pure regression test for filter-before-pick routing.
          test_path = Path("src/android/app/src/test/java/com/openminis/app/data/GroupResolveCredentialFilterTest.kt")
          if test_path.exists():
              raise SystemExit(f"{test_path}: unexpectedly already exists")
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text('''package com.openminis.app.data

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertNull
          import org.junit.Test

          /** Pins filter-before-pick semantics for credential-aware model groups. */
          class GroupResolveCredentialFilterTest {
              private data class Member(
                  val entryId: String,
                  val hidden: Boolean = false,
                  val providerEnabled: Boolean = true,
                  val credentialed: Boolean = true,
              )

              private fun available(members: List<Member>): List<String> =
                  members.filter { !it.hidden && it.providerEnabled && it.credentialed }
                      .map { it.entryId }

              private fun resolve(
                  members: List<Member>,
                  preferredEntryId: String? = null,
                  loadBalance: Boolean = false,
                  sessionId: String = "",
              ): String? {
                  val avail = available(members)
                  if (avail.isEmpty()) return null
                  return avail.firstOrNull { it == preferredEntryId }
                      ?: if (loadBalance) avail[Math.floorMod(sessionId.hashCode(), avail.size)]
                      else avail.first()
              }

              @Test
              fun `uncredentialed head member is skipped, not fatal to the whole group`() {
                  val group = listOf(
                      Member("dead/1", credentialed = false),
                      Member("dead/2", credentialed = false),
                      Member("ok/1"),
                      Member("ok/2"),
                  )
                  assertEquals("ok/1", resolve(group))
              }

              @Test
              fun `group resolves to null only when every member is unusable`() {
                  assertNull(
                      resolve(
                          listOf(
                              Member("a/1", credentialed = false),
                              Member("b/2", providerEnabled = false),
                              Member("c/3", hidden = true),
                          )
                      )
                  )
              }

              @Test
              fun `preferred member that lost credentials falls back to first available`() {
                  val group = listOf(
                      Member("a/1", credentialed = false),
                      Member("b/2"),
                      Member("c/3", credentialed = false),
                  )
                  assertEquals("b/2", resolve(group, preferredEntryId = "c/3"))
              }

              @Test
              fun `load balance only picks from the filtered set`() {
                  val group = listOf(
                      Member("dead/1", credentialed = false),
                      Member("ok/1"),
                      Member("ok/2"),
                  )
                  val usable = setOf("ok/1", "ok/2")
                  for (sid in listOf("", "s1", "s2", "session-abc", "😀")) {
                      assert(resolve(group, loadBalance = true, sessionId = sid) in usable)
                  }
              }
          }
          '''.replace("\n          ", "\n").lstrip())
          PY

      - name: Validate patch shape
        shell: bash
        run: |
          git diff --check
          grep -q 'SOUL.md fields (name / icon / style / lang / body)' src/android/app/src/main/java/com/openminis/app/agent/SoulStore.kt
          grep -q 'fun hasStoredCredential' src/android/app/src/main/java/com/openminis/app/auth/OAuthManager.kt
          grep -q 'fun availableMemberEntries' src/android/app/src/main/java/com/openminis/app/data/repository/ProviderRepository.kt
          grep -q 'Origin.AGENT_BACKGROUND' src/android/app/src/main/java/com/openminis/app/browser/BrowserUseManager.kt
          grep -q 'drainInterceptedDialogReport' src/android/app/src/main/java/com/openminis/app/browser/BrowserTabPool.kt
          grep -q 'KEY_RETURN_KEY_BEHAVIOR' src/android/app/src/main/java/com/openminis/app/config/ConfigBuiltins.kt
          grep -q 'path = "soul.icon"' src/android/app/src/main/java/com/openminis/app/config/ConfigBuiltins.kt

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/android/app/src/main/java/com/openminis/app/agent/SoulStore.kt \
            src/android/app/src/main/java/com/openminis/app/auth/OAuthManager.kt \
            src/android/app/src/main/java/com/openminis/app/data/repository/ProviderRepository.kt \
            src/android/app/src/main/java/com/openminis/app/ui/chat/ChatViewModel.kt \
            src/android/app/src/main/java/com/openminis/app/scheduled/ScheduledAgentRunner.kt \
            src/android/app/src/main/java/com/openminis/app/speech/correction/CorrectionStrategy.kt \
            src/android/app/src/main/java/com/openminis/app/browser/BrowserUseManager.kt \
            src/android/app/src/main/java/com/openminis/app/browser/BrowserTabPool.kt \
            src/android/app/src/main/java/com/openminis/app/config/ConfigBuiltins.kt \
            src/android/app/src/test/java/com/openminis/app/data/GroupResolveCredentialFilterTest.kt
          git commit -m 'fix(android): sync upstream behavior gaps'
          git push origin HEAD:sync/upstream-behavior-20260909
