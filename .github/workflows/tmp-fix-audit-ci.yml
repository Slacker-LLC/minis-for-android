name: tmp-fix-audit-ci

on:
  push:
    branches:
      - fix/upstream-audit-gaps-20260909

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/upstream-audit-gaps-20260909
          fetch-depth: 0
      - name: Fetch locked upstream baseline
        run: git fetch --no-tags --depth=1 https://github.com/OpenMinis/OpenMinis.git 4ef29002e88db1e20e462ec2ff46916e8a7dcb45
      - name: Apply fixes
        run: python3 .github/scripts/fix_audit_ci.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'import androidx.compose.foundation.clickable' src/android/app/src/main/java/com/openminis/app/ui/chat/ChatIndicators.kt
          grep -q 'import androidx.compose.runtime.mutableStateOf' src/android/app/src/main/java/com/openminis/app/ui/chat/ChatIndicators.kt
          grep -q 'import androidx.compose.foundation.layout.width' src/android/app/src/main/java/com/openminis/app/ui/settings/MemoryManagementScreen.kt
          for d in de ru ko ja fr; do
            grep -q 'name="newer_db_title"' "src/android/app/src/main/res/values-$d/strings.xml"
            grep -q 'name="newer_db_body"' "src/android/app/src/main/res/values-$d/strings.xml"
            grep -q 'name="newer_db_versions"' "src/android/app/src/main/res/values-$d/strings.xml"
            grep -q 'name="newer_db_exit"' "src/android/app/src/main/res/values-$d/strings.xml"
          done
      - name: Commit production fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/android/app
          git commit -m "fix(android): repair audited sync CI"
          git push origin HEAD:fix/upstream-audit-gaps-20260909
