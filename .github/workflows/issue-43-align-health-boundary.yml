name: Issue 43 align rootfs health boundary

on:
  push:
    branches: [fix/issue-43-runtime-recovery]

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Move rootfs health contract into active Ubuntu runtime
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 - <<'PY'
          from pathlib import Path

          rootfs = Path('src/android/app/src/main/java/com/openminis/app/sandbox/RootfsManager.kt')
          text = rootfs.read_text()
          text = text.replace(
              'import com.openminis.app.sandbox.minisd.MinisdProtocol\n',
              'import com.openminis.app.runtime.minisd.MinisdProtocol\n'
              'import com.openminis.app.runtime.ubuntu.RootfsHealth\n'
              'import com.openminis.app.runtime.ubuntu.RootfsHealthCode\n',
          )
          block = '''enum class RootfsHealthCode {\n    HEALTHY,\n    MISSING,\n    CORRUPT,\n    INCOMPATIBLE,\n    ROOT_UNAVAILABLE,\n}\n\ndata class RootfsHealth(\n    val code: RootfsHealthCode,\n    val detail: String,\n    val metadata: JSONObject? = null,\n) {\n    val healthy: Boolean get() = code == RootfsHealthCode.HEALTHY\n}\n\n'''
          if block not in text:
              raise SystemExit('expected RootfsHealth contract block not found in RootfsManager')
          text = text.replace(block, '', 1)
          if 'com.openminis.app.sandbox.minisd.' in text:
              raise SystemExit('legacy minisd FQN remains in RootfsManager')
          rootfs.write_text(text)

          health = Path('src/android/app/src/main/java/com/openminis/app/runtime/ubuntu/RootfsHealth.kt')
          if health.exists():
              raise SystemExit('RootfsHealth.kt unexpectedly already exists')
          health.write_text('''package com.openminis.app.runtime.ubuntu\n\nimport org.json.JSONObject\n\nenum class RootfsHealthCode {\n    HEALTHY,\n    MISSING,\n    CORRUPT,\n    INCOMPATIBLE,\n    ROOT_UNAVAILABLE,\n}\n\ndata class RootfsHealth(\n    val code: RootfsHealthCode,\n    val detail: String,\n    val metadata: JSONObject? = null,\n) {\n    val healthy: Boolean get() = code == RootfsHealthCode.HEALTHY\n}\n''')

          runtime = Path('src/android/app/src/main/java/com/openminis/app/runtime/ubuntu/UbuntuRuntime.kt')
          runtime_text = runtime.read_text()
          old = 'import com.openminis.app.sandbox.RootfsHealthCode\n'
          if old not in runtime_text:
              raise SystemExit('expected legacy RootfsHealthCode import not found in UbuntuRuntime')
          runtime.write_text(runtime_text.replace(old, '', 1))

          test = Path('src/android/app/src/test/java/com/openminis/app/runtime/recovery/RootfsManagerRecoveryTest.kt')
          test_text = test.read_text()
          old_test = 'import com.openminis.app.sandbox.RootfsHealthCode\n'
          if old_test not in test_text:
              raise SystemExit('expected legacy RootfsHealthCode import not found in recovery test')
          test.write_text(test_text.replace(old_test, 'import com.openminis.app.runtime.ubuntu.RootfsHealthCode\n', 1))
          PY

          bash scripts/check-runtime-package-boundary.sh
          git grep -n 'com\.openminis\.app\.sandbox\.minisd\.' -- src/android && exit 43 || true

          git add src/android/app/src/main/java/com/openminis/app/sandbox/RootfsManager.kt \
                  src/android/app/src/main/java/com/openminis/app/runtime/ubuntu/RootfsHealth.kt \
                  src/android/app/src/main/java/com/openminis/app/runtime/ubuntu/UbuntuRuntime.kt \
                  src/android/app/src/test/java/com/openminis/app/runtime/recovery/RootfsManagerRecoveryTest.kt
          git rm .github/workflows/issue-43-align-health-boundary.yml
          git commit -m 'fix: align rootfs recovery contract with runtime boundary'
          git push origin HEAD:fix/issue-43-runtime-recovery
