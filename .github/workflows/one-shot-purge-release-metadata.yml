name: One-shot purge release metadata

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    if: github.repository == 'Slacker-LLC/minis-for-android'
    runs-on: ubuntu-latest
    steps:
      - name: Delete all GitHub Releases and Git tags
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );
            for (const release of releases) {
              core.info(`Deleting release ${release.tag_name} (#${release.id})`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });
            }

            const refs = await github.paginate(
              github.rest.git.listMatchingRefs,
              { owner, repo, ref: 'tags/' }
            );
            for (const ref of refs) {
              const shortRef = ref.ref.replace(/^refs\//, '');
              core.info(`Deleting ${ref.ref}`);
              await github.rest.git.deleteRef({ owner, repo, ref: shortRef });
            }

            core.info(`Deleted ${releases.length} release(s) and ${refs.length} tag(s).`);

      - name: Remove this one-shot workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const path = '.github/workflows/one-shot-purge-release-metadata.yml';
            const result = await github.rest.repos.getContent({
              owner,
              repo,
              path,
              ref: 'master',
            });
            if (Array.isArray(result.data)) {
              core.setFailed('Unexpected directory response while deleting one-shot workflow');
              return;
            }
            await github.rest.repos.deleteFile({
              owner,
              repo,
              path,
              branch: 'master',
              sha: result.data.sha,
              message: 'chore(repo): remove one-shot release cleanup workflow',
            });
