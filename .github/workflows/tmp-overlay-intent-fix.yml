name: tmp-overlay-intent-fix

on:
  push:
    branches:
      - fix/upstream-audit-gaps-20260909

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/upstream-audit-gaps-20260909
      - name: Apply overlay intent fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/android/app/src/main/java/com/openminis/app/ui/settings/BackgroundSettingsScreen.kt')
          s = p.read_text(encoding='utf-8')
          old = '                checked = backgroundOverlayEnabled && canDrawOverlays,\n'
          new = '                // The switch represents the persisted USER INTENT. Permission is a\n                // separate capability gate, surfaced by the footer and enforced by the service.\n                checked = backgroundOverlayEnabled,\n'
          if old not in s or s.count(old) != 1:
              raise SystemExit('overlay checked anchor missing/non-unique')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          grep -q 'checked = backgroundOverlayEnabled,' src/android/app/src/main/java/com/openminis/app/ui/settings/BackgroundSettingsScreen.kt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/android/app/src/main/java/com/openminis/app/ui/settings/BackgroundSettingsScreen.kt
          git commit -m "fix(android): preserve overlay toggle intent"
          git push origin HEAD:fix/upstream-audit-gaps-20260909
