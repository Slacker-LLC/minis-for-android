name: tmp-direct-runtime-phase2a

on:
  push:
    branches:
      - refactor/direct-ubuntu-runtime

permissions:
  contents: write

jobs:
  cleanup-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/direct-ubuntu-runtime
          fetch-depth: 0
      - name: Apply phase 2a cleanup
        run: python3 .github/scripts/phase2a_direct_runtime_cleanup.py
      - name: Validate diff
        run: |
          git diff --check
          if grep -RInE 'runtime\.minisd\.(MinisdClient|MinisdProtocol|MinisdBootstrap|ExecutionCancellationRegistry)' src/android/app/src/main/java src/android/app/src/test/java; then
            echo 'stale broker API reference remains' >&2
            exit 1
          fi
      - name: Commit phase 2a
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(runtime): remove dead minisd client layers"
          git push origin HEAD:refactor/direct-ubuntu-runtime
      - uses: actions/setup-go@v5
        with:
          go-version-file: deps/rclone-mobile/go.mod
          cache: true
          cache-dependency-path: deps/rclone-mobile/go.sum
      - name: Install pinned Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          test -x "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build rclone Android binding
        run: |
          go install golang.org/x/mobile/cmd/gomobile@f98cc9b
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          bash deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5.0.2
      - name: Compile and run JVM tests
        env:
          MINIS_REQUIRE_RUNTIME_PAYLOAD: '0'
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --max-workers=4 --stacktrace
