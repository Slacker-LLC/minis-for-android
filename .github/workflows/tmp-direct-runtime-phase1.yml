name: tmp-direct-runtime-phase1

on:
  push:
    branches:
      - refactor/direct-ubuntu-runtime

permissions:
  contents: read

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/direct-ubuntu-runtime
      - uses: actions/setup-go@v5
        with:
          go-version-file: deps/rclone-mobile/go.mod
          cache: true
          cache-dependency-path: deps/rclone-mobile/go.sum
      - name: Install pinned Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          test -x "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build rclone Android binding
        run: |
          go install golang.org/x/mobile/cmd/gomobile@f98cc9b
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          bash deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5.0.2
      - name: Compile Android Kotlin
        env:
          MINIS_REQUIRE_RUNTIME_PAYLOAD: '0'
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --max-workers=4 --stacktrace
