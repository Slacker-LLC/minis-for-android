name: Apply provider transport wiring v2

on:
  push:
    branches: [fix/provider-transport-policy]
    paths:
      - .github/workflows/apply-provider-transport-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/provider-transport-policy
      - name: Apply corrected transport wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-provider-transport.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])

          old = "    if found != count:\n"
          new = '''    if found != count and not (\n        path.endswith("ProviderDetailScreen.kt")\n        and found == 2\n        and old.startswith("                    )\\n                }\\n                HorizontalDivider(")\n    ):\n'''
          if script.count(old) != 1:
              raise SystemExit(f'helper guard match count={script.count(old)}')
          script = script.replace(old, new, 1)
          compile(script, '<transport-wiring>', 'exec')
          exec(script, {'__name__': '__main__'})
          PY

          git diff --check
          git status --short

      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/android
          git commit -m "security: wire provider transport policy"
          git push origin HEAD:fix/provider-transport-policy
