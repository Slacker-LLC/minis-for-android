name: Issue 52 Android identity migration

on:
  push:
    branches: [feat/issue-52-android-identity]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Migrate active Android identity
        run: bash scripts/issue-52-migrate-identity.sh
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: migrate Android application identity'
          git push origin HEAD:feat/issue-52-android-identity
