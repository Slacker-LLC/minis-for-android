name: GH32 sampling patch

on:
  push:
    branches:
      - feature/issue-32-session-overrides

permissions:
  contents: write

jobs:
  apply-sampling-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/issue-32-session-overrides
          fetch-depth: 0

      - name: Apply provider-aware sampling patch
        run: |
          set +e
          output="$(python3 scripts/gh32_sampling_patch.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] && ! grep -Fq 'agent sampling entry: expected exactly one match' <<<"$output"; then
            exit "$status"
          fi

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/android/app/src/main/java/com/openminis/app/ui/chat/ChatViewModel.kt')
          lines = p.read_text().splitlines()

          call_hits = [i for i, line in enumerate(lines)
                       if line.strip() == 'currentProvider.streamMessage('
                       and i + 1 < len(lines)
                       and 'messages = applyRequestImageBudget(effectiveAgentHistory())' in lines[i + 1]]
          if len(call_hits) != 1:
              raise SystemExit(f'agent sampling entry line match: expected 1, found {len(call_hits)}')
          i = call_hits[0]
          lines[i] = lines[i].replace('currentProvider.streamMessage(', 'currentProvider.streamMessageWithSampling(')

          value_hits = [i for i, line in enumerate(lines)
                        if line.strip() == 'temperature = sessionOverrides.temperature,'
                        and i + 1 < len(lines)
                        and lines[i + 1].strip() == 'tools = turnTools,']
          if len(value_hits) != 1:
              raise SystemExit(f'agent sampling values line match: expected 1, found {len(value_hits)}')
          i = value_hits[0]
          indent = lines[i + 1][:len(lines[i + 1]) - len(lines[i + 1].lstrip())]
          lines[i + 2:i + 2] = [
              indent + 'topP = sessionOverrides.topP,',
              indent + 'topK = sessionOverrides.topK,',
          ]
          p.write_text('\n'.join(lines) + '\n')
          PY

          git diff --check

      - name: Commit sampling wiring and remove temporary files
        run: |
          rm .github/workflows/gh32-sampling-patch.yml scripts/gh32_sampling_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/android/app/src/main/java/com/openminis/app/provider/anthropic/AnthropicProvider.kt src/android/app/src/main/java/com/openminis/app/provider/gemini/GeminiProvider.kt src/android/app/src/main/java/com/openminis/app/provider/openai/OpenAIProvider.kt src/android/app/src/main/java/com/openminis/app/ui/chat/ChatViewModel.kt .github/workflows/gh32-sampling-patch.yml scripts/gh32_sampling_patch.py
          git diff --cached --check
          git commit -m 'feat(session): apply top-p and top-k by provider capability'
          git push origin HEAD:feature/issue-32-session-overrides
