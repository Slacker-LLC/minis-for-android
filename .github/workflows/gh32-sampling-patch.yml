name: GH32 sampling patch

on:
  push:
    branches:
      - feature/issue-32-session-overrides

permissions:
  contents: write

jobs:
  apply-sampling-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/issue-32-session-overrides
          fetch-depth: 0

      - name: Apply provider-aware sampling patch
        run: |
          python3 scripts/gh32_sampling_patch.py
          git diff --check
          git diff -- src/android/app/src/main/java/com/openminis/app/provider/anthropic/AnthropicProvider.kt src/android/app/src/main/java/com/openminis/app/provider/gemini/GeminiProvider.kt src/android/app/src/main/java/com/openminis/app/provider/openai/OpenAIProvider.kt src/android/app/src/main/java/com/openminis/app/ui/chat/ChatViewModel.kt

      - name: Commit sampling wiring and remove temporary files
        run: |
          rm .github/workflows/gh32-sampling-patch.yml scripts/gh32_sampling_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/android/app/src/main/java/com/openminis/app/provider/anthropic/AnthropicProvider.kt src/android/app/src/main/java/com/openminis/app/provider/gemini/GeminiProvider.kt src/android/app/src/main/java/com/openminis/app/provider/openai/OpenAIProvider.kt src/android/app/src/main/java/com/openminis/app/ui/chat/ChatViewModel.kt .github/workflows/gh32-sampling-patch.yml scripts/gh32_sampling_patch.py
          git diff --cached --check
          git commit -m 'feat(session): apply top-p and top-k by provider capability'
          git push origin HEAD:feature/issue-32-session-overrides
