name: One-shot minisd rustfmt

on:
  push:
    branches:
      - fix/release-ci-hardening
    paths:
      - .github/workflows/one-shot-rustfmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/release-ci-hardening
          fetch-depth: 0
      - name: Apply rustfmt
        run: cargo fmt --manifest-path src/native/minisd/Cargo.toml --all
      - name: Commit formatting
        run: |
          if git diff --quiet -- src/native/minisd; then
            echo "minisd already formatted"
            exit 0
          fi
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native/minisd
          git commit -m "style(minisd): apply rustfmt"
          git push origin HEAD:fix/release-ci-hardening
