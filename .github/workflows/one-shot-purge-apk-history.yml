name: One-shot purge APK history

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge-apk-history:
    if: github.repository == 'Slacker-LLC/minis-for-android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-filter-repo
        run: python3 -m pip install --user git-filter-repo

      - name: Remove temporary cleanup branch
        run: |
          git push origin --delete chore/repository-cleanup-20260827 || true

      - name: Purge APK files from Git history
        run: |
          echo "APK objects reachable before rewrite:"
          git rev-list --objects --all | grep -Ei '\.apk$' || true

          git filter-repo --force --path-glob '*.apk' --invert-paths

          if ! git remote get-url origin >/dev/null 2>&1; then
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi

          echo "Checking rewritten history..."
          if git rev-list --objects --all | grep -Ei '\.apk$'; then
            echo "APK path still reachable after history rewrite"
            exit 1
          fi

      - name: Force-push rewritten master
        run: git push --force origin HEAD:master
