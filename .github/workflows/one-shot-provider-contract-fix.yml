name: One-shot provider contract fixes

on:
  push:
    branches:
      - fix/release-ci-hardening
    paths:
      - .github/workflows/one-shot-provider-contract-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/release-ci-hardening
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply provider contract fixes
        run: python3 scripts/one-shot-provider-contract-fix.py
      - name: Warm Gradle dependencies
        working-directory: src/android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            ./gradlew help --refresh-dependencies --no-parallel --max-workers=2 && exit 0
            test "$attempt" -eq 3 && exit 1
            sleep $((attempt * 10))
          done
      - name: Run provider contract tests
        working-directory: src/android
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.openminis.app.provider.AnthropicProviderTest' \
            --tests 'com.openminis.app.provider.OpenAIProviderTest' \
            --no-parallel --max-workers=2 --stacktrace
      - name: Commit fixes and remove one-shot files
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/one-shot-provider-contract-fix.yml \
            scripts/one-shot-provider-contract-fix.py
          git add \
            src/android/app/src/main/java/com/openminis/app/provider/anthropic/AnthropicProvider.kt \
            src/android/app/src/test/java/com/openminis/app/provider/AnthropicProviderTest.kt \
            src/android/app/src/test/java/com/openminis/app/provider/OpenAIProviderTest.kt
          git commit -m "fix(provider): align public tests with runtime contracts"
          git push origin HEAD:fix/release-ci-hardening
