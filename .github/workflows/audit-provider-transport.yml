name: Audit provider transport clients

on:
  push:
    branches: [fix/provider-transport-policy]
    paths:
      - .github/workflows/audit-provider-transport.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/provider-transport-policy
      - name: Enumerate security-sensitive OkHttp construction
        shell: bash
        run: |
          echo '=== auth ==='
          grep -RInE 'OkHttpClient(\.Builder)?\(' src/android/app/src/main/java/com/openminis/app/auth || true
          echo '=== update ==='
          grep -nE 'OkHttpClient(\.Builder)?\(' src/android/app/src/main/java/com/openminis/app/data/UpdateChecker.kt || true
          echo '=== provider ==='
          grep -RInE 'OkHttpClient(\.Builder)?\(' src/android/app/src/main/java/com/openminis/app/provider || true
          echo '=== literal http URLs outside loopback/tests ==='
          grep -RIn 'http://' src/android/app/src/main/java/com/openminis/app/auth src/android/app/src/main/java/com/openminis/app/data/UpdateChecker.kt src/android/app/src/main/java/com/openminis/app/provider || true
