name: GH32 UI patch

on:
  push:
    branches:
      - feature/issue-32-session-overrides

permissions:
  contents: write

jobs:
  apply-ui-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/issue-32-session-overrides
          fetch-depth: 0

      - name: Wire advanced settings into ChatScreen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/android/app/src/main/java/com/openminis/app/ui/chat/ChatScreen.kt')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import androidx.compose.material.icons.filled.Memory\nimport androidx.compose.material.icons.filled.ArrowCircleDown\n',
              'import androidx.compose.material.icons.filled.Memory\nimport androidx.compose.material.icons.filled.Settings\nimport androidx.compose.material.icons.filled.ArrowCircleDown\n',
              'Settings icon import',
          )

          replace_once(
              '''    // [T-mcp-integration-android] MCPs-in-Session sheet visibility.\n    var showMcpsSheet by remember { mutableStateOf(false) }\n    var showTokenUsageSheet by remember { mutableStateOf(false) }\n''',
              '''    // [T-mcp-integration-android] MCPs-in-Session sheet visibility.\n    var showMcpsSheet by remember { mutableStateOf(false) }\n    // GH#32/#35: session-local prompt/model/tool overrides.\n    var showSessionAdvancedSettings by rememberSaveable { mutableStateOf(false) }\n    var showTokenUsageSheet by remember { mutableStateOf(false) }\n''',
              'advanced settings visibility state',
          )

          replace_once(
              '''                            }\n                            // Session Memory (iOS parity)\n''',
              '''                            }\n                            // GH#32/#35: first-class editor for session-local overrides.\n                            DropdownMenuItem(\n                                text = { Text(stringResource(R.string.session_advanced_settings_menu)) },\n                                onClick = {\n                                    showChatMenu = false\n                                    showSessionAdvancedSettings = true\n                                },\n                                leadingIcon = {\n                                    Icon(Icons.Default.Settings, contentDescription = null)\n                                },\n                            )\n                            // Session Memory (iOS parity)\n''',
              'advanced settings menu item',
          )

          replace_once(
              '''    // [T-mcp-integration-android] MCPs-in-Session sheet.\n''',
              '''    // GH#32/#35: session-local advanced settings sheet.\n    if (showSessionAdvancedSettings) {\n        SessionAdvancedSettingsSheet(\n            sessionId = sessionId,\n            chatRepository = chatRepository,\n            onDismiss = { showSessionAdvancedSettings = false },\n        )\n    }\n\n    // [T-mcp-integration-android] MCPs-in-Session sheet.\n''',
              'advanced settings sheet mount',
          )

          path.write_text(text)
          PY

          git diff --check
          git diff -- src/android/app/src/main/java/com/openminis/app/ui/chat/ChatScreen.kt

      - name: Commit UI wiring and remove temporary workflow
        run: |
          rm .github/workflows/gh32-ui-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/android/app/src/main/java/com/openminis/app/ui/chat/ChatScreen.kt .github/workflows/gh32-ui-patch.yml
          git diff --cached --check
          git commit -m 'feat(session): expose advanced settings in chat menu'
          git push origin HEAD:feature/issue-32-session-overrides
