name: GH32 runtime UI patch

on:
  push:
    branches:
      - feature/issue-32-session-overrides

permissions:
  contents: write

jobs:
  apply-runtime-ui-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/issue-32-session-overrides
          fetch-depth: 0

      - name: Patch ChatViewModel and ChatScreen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vm_path = Path('src/android/app/src/main/java/com/openminis/app/ui/chat/ChatViewModel.kt')
          vm = vm_path.read_text()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          vm = replace_once(
              vm,
              '''    /** Toggle memory writes on/off, persist to DB, and append a system-info message. */\n    private fun toggleMemoryEnabled() {\n''',
              '''    /**\n     * Set memory for the active session from a settings surface. Unlike a raw\n     * DAO write this updates the live StateFlow first, so the next agent turn\n     * immediately rebuilds its memory-gated tool list and system prompt.\n     */\n    fun setMemoryEnabledForSession(enabled: Boolean) {\n        if (_memoryEnabled.value == enabled) return\n        _memoryEnabled.value = enabled\n        viewModelScope.launch {\n            val sid = ensureSession()\n            chatRepository.dao.updateMemoryEnabled(sid, if (enabled) 1 else 0)\n        }\n    }\n\n    /** Toggle memory writes on/off, persist to DB, and append a system-info message. */\n    private fun toggleMemoryEnabled() {\n''',
              'memory settings setter',
          )

          vm = replace_once(
              vm,
              '''    /** T-chat-title-pill-edit: load the persisted [ChatSessionEntity] for the\n''',
              '''    /**\n     * Ensure a durable row exists before a UI edits per-session settings.\n     * Draft chats normally materialize on first send; opening Advanced settings\n     * is also a durable session action and must not write against the synthetic\n     * `__new__` route id.\n     */\n    suspend fun ensureSessionForSettings(): String = ensureSession()\n\n    /** T-chat-title-pill-edit: load the persisted [ChatSessionEntity] for the\n''',
              'draft materialization API',
          )

          vm_path.write_text(vm)

          screen_path = Path('src/android/app/src/main/java/com/openminis/app/ui/chat/ChatScreen.kt')
          screen = screen_path.read_text()
          screen = replace_once(
              screen,
              '''        SessionAdvancedSettingsSheet(\n            sessionId = sessionId,\n            chatRepository = chatRepository,\n            onDismiss = { showSessionAdvancedSettings = false },\n        )\n''',
              '''        SessionAdvancedSettingsSheet(\n            sessionId = sessionId,\n            chatRepository = chatRepository,\n            viewModel = viewModel,\n            onDismiss = { showSessionAdvancedSettings = false },\n        )\n''',
              'advanced settings ViewModel wiring',
          )
          screen_path.write_text(screen)
          PY

          git diff --check
          git diff -- src/android/app/src/main/java/com/openminis/app/ui/chat/ChatViewModel.kt src/android/app/src/main/java/com/openminis/app/ui/chat/ChatScreen.kt

      - name: Commit runtime UI wiring and remove temporary workflow
        run: |
          rm .github/workflows/gh32-runtime-ui-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/android/app/src/main/java/com/openminis/app/ui/chat/ChatViewModel.kt src/android/app/src/main/java/com/openminis/app/ui/chat/ChatScreen.kt .github/workflows/gh32-runtime-ui-patch.yml
          git diff --cached --check
          git commit -m 'feat(session): integrate live memory and thinking settings'
          git push origin HEAD:feature/issue-32-session-overrides
