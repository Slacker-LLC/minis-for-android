name: Issue 54 runtime package migration

on:
  push:
    branches: [fix/issue-54-runtime-package-boundary]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Migrate runtime package boundary
        run: bash scripts/issue-54-migrate-runtime-boundary.sh
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: replace legacy sandbox package boundary'
          git push origin HEAD:fix/issue-54-runtime-package-boundary
