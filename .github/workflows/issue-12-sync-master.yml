name: Issue 12 sync current master

on:
  push:
    branches:
      - fix/issue-12-provider-customization
    paths:
      - .github/workflows/issue-12-sync-master.yml

permissions:
  contents: write

jobs:
  merge-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/issue-12-provider-customization
          fetch-depth: 0
      - name: Merge current master without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          if ! git merge --no-ff origin/master -m 'Merge master into fix/issue-12-provider-customization'; then
            echo 'ISSUE12_MERGE_CONFLICTS_BEGIN'
            git diff --name-only --diff-filter=U
            echo 'ISSUE12_MERGE_CONFLICTS_END'
            exit 12
          fi
          git rm .github/workflows/issue-12-sync-master.yml
          git commit --amend --no-edit
          git push origin HEAD:fix/issue-12-provider-customization
