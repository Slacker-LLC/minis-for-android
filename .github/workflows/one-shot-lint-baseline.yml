name: One-shot Android lint baseline

on:
  push:
    branches:
      - fix/android-lint-baseline

permissions:
  contents: write

jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/android-lint-baseline
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Patch guarded permission accesses and baseline config
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tools = Path('src/android/app/src/main/java/com/openminis/app/tools/AndroidConnectivityTools.kt')
          text = tools.read_text()
          if 'import android.annotation.SuppressLint\n' not in text:
              text = text.replace('import android.Manifest\n', 'import android.Manifest\nimport android.annotation.SuppressLint\n', 1)
          for sig in [
              '    suspend fun wifiInfo(',
              '    suspend fun wifiScan(',
              '    suspend fun bluetoothStatus(',
              '    suspend fun bluetoothPaired(',
              '    suspend fun bluetoothScan(',
          ]:
              annotated = '    @SuppressLint("MissingPermission")\n' + sig
              if annotated not in text:
                  text = text.replace(sig, annotated, 1)
          tools.write_text(text)

          gradle = Path('src/android/app/build.gradle.kts')
          text = gradle.read_text()
          marker = '    lint {\n'
          baseline = '    lint {\n        // Existing debt snapshot only. New findings must fail CI; this file may only shrink.\n        baseline = file("lint-baseline.xml")\n\n'
          if 'baseline = file("lint-baseline.xml")' not in text:
              if marker not in text:
                  raise SystemExit('lint block not found')
              text = text.replace(marker, baseline, 1)
          gradle.write_text(text)
          PY

      - name: Generate checked-in baseline
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:updateLintBaseline --no-parallel --max-workers=2 --stacktrace

      - name: Verify debug lint with baseline
        working-directory: src/android
        run: ./gradlew :app:lintDebug --no-parallel --max-workers=2 --stacktrace

      - name: Commit generated baseline and fixes
        run: |
          test -s src/android/app/lint-baseline.xml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/android/app/build.gradle.kts \
            src/android/app/lint-baseline.xml \
            src/android/app/src/main/java/com/openminis/app/tools/AndroidConnectivityTools.kt
          git commit -m 'ci(android): establish lint baseline' || exit 0
          git push origin HEAD:fix/android-lint-baseline
