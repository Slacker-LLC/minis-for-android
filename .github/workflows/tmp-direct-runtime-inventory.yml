name: tmp-direct-runtime-phase3

on:
  push:
    branches:
      - refactor/direct-ubuntu-runtime

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: deps/rclone-mobile/go.mod
          cache: true
          cache-dependency-path: deps/rclone-mobile/go.sum
      - uses: gradle/actions/setup-gradle@v5.0.2
      - name: Harden one-off worker
        run: python3 .github/scripts/phase3_preflight.py
      - name: Execute phased direct-runtime cleanup
        run: python3 .github/scripts/phase3_direct_runtime_cleanup.py
