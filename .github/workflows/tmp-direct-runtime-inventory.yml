name: tmp-direct-runtime-inventory

on:
  push:
    branches:
      - refactor/direct-ubuntu-runtime

permissions:
  contents: read

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Runtime dependency inventory
        run: |
          echo '=== minisd package refs ==='
          grep -RInE --exclude-dir=.git --exclude-dir=build --exclude-dir=minisd 'runtime\.minisd|Minisd[A-Za-z]+|minisd' src/android/app/src/main src/android/app/src/test src/android/app/build.gradle.kts src/android/build.gradle.kts 2>/dev/null || true
          echo '=== UbuntuRuntime.client refs ==='
          grep -RInE 'UbuntuRuntime\.client|\.client\.(ubuntu|root|runtime|workspace|mount|cancel)' src/android/app/src/main/java 2>/dev/null || true
          echo '=== WorkspaceFileClient refs ==='
          grep -RIn 'WorkspaceFileClient' src/android/app/src/main/java 2>/dev/null || true
          echo '=== runtime/native payload refs ==='
          grep -RInE --exclude-dir=.git 'libminisd|minisd\.so|src/minisd|runtime payload|runtime_payload|RUNTIME_PAYLOAD' src/android .github 2>/dev/null || true
          echo '=== su/process/chroot helpers ==='
          grep -RInE 'ProcessBuilder\(|/system/bin/su|resolveSu\(|su -c|chroot|unshare|mount --bind' src/android/app/src/main/java src/android/app/src/main/assets 2>/dev/null || true
