name: tmp-direct-runtime-phase2c

on:
  push:
    branches:
      - refactor/direct-ubuntu-runtime

permissions:
  contents: write

jobs:
  provisioner:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/direct-ubuntu-runtime
          fetch-depth: 0
      - name: Apply provisioner wiring
        run: python3 .github/scripts/phase2c_wire_provisioner.py
      - name: Validate diff
        run: |
          git diff --check
          grep -Fq 'UbuntuProvisioner.ensureProvisioned(ctx)' src/android/app/src/main/java/com/openminis/app/runtime/ubuntu/UbuntuKernel.kt
          test ! -e src/android/app/src/main/java/com/openminis/app/runtime/minisd/MinisdConfigBridgeServer.kt
      - name: Commit provisioner wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(runtime): provision Ubuntu without minisd"
          git push origin HEAD:refactor/direct-ubuntu-runtime
      - uses: actions/setup-go@v5
        with:
          go-version-file: deps/rclone-mobile/go.mod
          cache: true
          cache-dependency-path: deps/rclone-mobile/go.sum
      - name: Install pinned Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          test -x "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build rclone Android binding
        run: |
          go install golang.org/x/mobile/cmd/gomobile@f98cc9b
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          bash deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5.0.2
      - name: Compile and run runtime tests
        env:
          MINIS_REQUIRE_RUNTIME_PAYLOAD: '0'
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --tests 'com.openminis.app.runtime.*' --tests 'com.openminis.app.runtime.guest.*' --tests 'com.openminis.app.runtime.ubuntu.*' --max-workers=4 --stacktrace
