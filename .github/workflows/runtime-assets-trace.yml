name: Runtime asset trace

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: runtime-assets-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace:
    name: Trace debug runtime asset packaging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
          rustup target add aarch64-linux-android
      - name: Build pinned Ubuntu arm64 runtime artifact
        run: bash scripts/build-ubuntu-rootfs.sh
      - name: Trace AGP merge inputs and final APK ZIP
        working-directory: src/android
        run: |
          cat >/tmp/runtime-assets-probe.gradle <<'GRADLE'
          allprojects {
            tasks.configureEach { task ->
              if (task.name == 'mergeDebugAssets') {
                task.doFirst {
                  println('RUNTIME_PROBE mergeDebugAssets all inputs:')
                  task.inputs.files.files.toList().sort { a, b -> a.absolutePath <=> b.absolutePath }.each { file ->
                    println("RUNTIME_PROBE input path=${file.absolutePath} exists=${file.exists()} dir=${file.isDirectory()} bytes=${file.isFile() ? file.length() : -1}")
                  }
                }
                task.doLast {
                  println('RUNTIME_PROBE mergeDebugAssets outputs:')
                  task.outputs.files.files.toList().sort { a, b -> a.absolutePath <=> b.absolutePath }.each { file ->
                    println("RUNTIME_PROBE output path=${file.absolutePath} exists=${file.exists()} dir=${file.isDirectory()}")
                  }
                }
              }
            }
          }
          GRADLE
          set +e
          ./gradlew :app:assembleDebug :app:verifyDebugMinisdApk -I /tmp/runtime-assets-probe.gradle --no-parallel --max-workers=2 --stacktrace
          status=$?
          set -e
          echo 'RUNTIME_PROBE generated/merged runtime candidates:'
          find app/build -type f \( -name 'ubuntu-arm64-rootfs.tar.gz' -o -name 'runtime-manifest.json' \) -printf '%p %s bytes\n' | sort || true
          echo 'RUNTIME_PROBE runtimeAssets directories:'
          find app/build -type d -path '*runtimeAssets*' -print | sort || true
          apk=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$apk" ]; then
            echo 'RUNTIME_PROBE final APK all asset entries:'
            unzip -Z1 "$apk" | grep '^assets/' | sort || true
            echo 'RUNTIME_PROBE final APK runtime-like entries:'
            unzip -Z1 "$apk" | grep -E '(minis-runtime|ubuntu-arm64-rootfs|runtime-manifest)' | sort || true
          else
            echo "RUNTIME_PROBE final APK missing: $apk"
          fi
          exit "$status"
