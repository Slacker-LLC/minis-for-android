[package]
name = "minis-root-network-proxy"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Single-purpose root outbound proxy for Minis direct Ubuntu guests"
publish = false

[[bin]]
name = "minis-root-network-proxy"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
